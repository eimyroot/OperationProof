name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the bounded behavior and trust-model impact.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and verification considerations
